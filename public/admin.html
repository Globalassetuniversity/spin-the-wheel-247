<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel Admin — Payments &amp; Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #020617; color: #e2e8f0; font-family: 'Rajdhani', sans-serif; padding: 20px 16px 48px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; color: #22d3ee; }
  .muted { color: #94a3b8; }
  input, button { font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 700; }
  input { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid rgba(34,211,238,.3); background: rgba(2,6,23,.7); color: #e2e8f0; outline: none; box-sizing: border-box; }
  .btn { background: linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899); border: none; border-radius: 10px; color: #020617; padding: 11px 18px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 14px; }
  .card { background: rgba(15,23,42,.72); border: 1px solid rgba(34,211,238,.25); border-radius: 14px; padding: 14px; margin-top: 14px; }
  .claim { border-bottom: 1px solid rgba(148,163,184,.15); padding: 10px 0; }
  .claim:last-child { border-bottom: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { font-family: 'Orbitron', sans-serif; font-size: 12px; padding: 3px 8px; border-radius: 999px; background: rgba(245,158,11,.15); color: #f59e0b; }
  .tag.bundle { background: rgba(34,211,238,.15); color: #22d3ee; }
  .tag.rejected { background: rgba(248,113,113,.15); color: #f87171; }
  .msg { min-height: 22px; font-weight: 700; margin-top: 8px; }
  .msg.ok { color: #14b8a6; } .msg.err { color: #f87171; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; }
  .stats b { font-family: 'Orbitron', sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1>WHEEL ADMIN</h1>
  <p class="muted">Card payments confirm themselves now — a player pays on the game page and their plays are added automatically. Nothing to confirm by hand. This page shows the jackpot, your house cut, and recent payments.</p>

  <div class="card">
    <div class="row">
      <input id="code" type="password" placeholder="Admin code" autocomplete="off" style="flex:1;min-width:180px">
      <button class="btn" id="loadBtn">Show stats</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="stats" id="stats" style="margin-top:8px"></div>
  </div>

  <div class="card" id="recentCard" style="display:none">
    <h2 style="font-family:'Orbitron',sans-serif;font-size:16px;color:#22d3ee;margin:0 0 6px">Recent payments</h2>
    <div id="recent"></div>
  </div>
</div>
<script>
(function () {
  var codeInput = document.getElementById('code');
  var msg = document.getElementById('msg');
  function money(c) { return '$' + (c / 100).toFixed(2); }
  function time(ms) { return new Date(ms).toLocaleString('en-US', { timeZone: 'America/New_York' }); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function load() {
    var code = codeInput.value;
    msg.className = 'msg'; msg.textContent = '';
    fetch('/api/admin/stats', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { msg.classList.add('err'); msg.textContent = d.error || 'Something went wrong.'; return; }
        msg.classList.add('ok'); msg.textContent = 'Loaded.';
        document.getElementById('stats').innerHTML =
          '<span>Jackpot: <b>' + money(d.jackpotCents) + '</b></span>' +
          '<span>House cut so far: <b>' + money(d.houseCents) + '</b></span>' +
          '<span>Card payments: <b>' + (d.paymentsLive ? 'LIVE' : 'OFF (free preview)') + '</b></span>';
        var rEl = document.getElementById('recent');
        document.getElementById('recentCard').style.display = '';
        rEl.innerHTML = d.recent.length ? d.recent.map(function (c) {
          var tag = c.status === 'confirmed' ? (c.kind === 'bundle' ? 'BUNDLE $100' : 'SINGLE $5')
            : c.status === 'rejected' ? 'FAILED' : c.status.toUpperCase();
          var cls = c.kind === 'bundle' ? ' bundle' : (c.status === 'rejected' ? ' rejected' : '');
          return '<div class="claim"><span class="tag' + cls + '">' + tag + '</span> ' +
            '<b>' + esc(c.player_name || 'Player') + '</b> — ' + money(c.amount_cents) + ' • ' + time(c.created_at) +
            (c.payment_id ? ' • Square: ' + esc(c.payment_id) : '') + (c.verify_note ? ' • ' + esc(c.verify_note) : '') + '</div>';
        }).join('') : '<p class="muted">No payments yet.</p>';
      })
      .catch(function () { msg.classList.add('err'); msg.textContent = 'Could not reach the game.'; });
  }
  document.getElementById('loadBtn').addEventListener('click', load);
})();
</script>
</body>
</html>

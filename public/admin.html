<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wheel Admin — Confirm Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #020617; color: #e2e8f0; font-family: 'Rajdhani', sans-serif; padding: 20px 16px 48px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-family: 'Orbitron', sans-serif; font-size: 24px; color: #22d3ee; }
  .muted { color: #94a3b8; }
  input, button { font-family: 'Rajdhani', sans-serif; font-size: 17px; font-weight: 700; }
  input { width: 100%; padding: 11px 13px; border-radius: 10px; border: 1px solid rgba(34,211,238,.3); background: rgba(2,6,23,.7); color: #e2e8f0; outline: none; box-sizing: border-box; }
  .btn { background: linear-gradient(90deg,#22d3ee,#8b5cf6,#ec4899); border: none; border-radius: 10px; color: #020617; padding: 11px 18px; cursor: pointer; font-family: 'Orbitron', sans-serif; font-size: 14px; }
  .btn.ghost { background: transparent; border: 1px solid rgba(148,163,184,.5); color: #e2e8f0; }
  .card { background: rgba(15,23,42,.72); border: 1px solid rgba(34,211,238,.25); border-radius: 14px; padding: 14px; margin-top: 14px; }
  .claim { border-bottom: 1px solid rgba(148,163,184,.15); padding: 10px 0; }
  .claim:last-child { border-bottom: none; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .tag { font-family: 'Orbitron', sans-serif; font-size: 12px; padding: 3px 8px; border-radius: 999px; background: rgba(245,158,11,.15); color: #f59e0b; }
  .tag.bundle { background: rgba(34,211,238,.15); color: #22d3ee; }
  .msg { min-height: 22px; font-weight: 700; margin-top: 8px; }
  .msg.ok { color: #14b8a6; } .msg.err { color: #f87171; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; }
  .stats b { font-family: 'Orbitron', sans-serif; }
</style>
</head>
<body>
<div class="wrap">
  <h1>WHEEL ADMIN</h1>
  <p class="muted">Confirm Square payments here. Match the player's name, amount and time against your Square sales before you tap Confirm — confirming adds the plays to their account. An order can only ever be confirmed once.</p>

  <div class="card">
    <div class="row">
      <input id="code" type="password" placeholder="Admin code" autocomplete="off" style="flex:1;min-width:180px">
      <button class="btn" id="loadBtn">Show claims</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="stats" id="stats" style="margin-top:8px"></div>
  </div>

  <div class="card" id="pendingCard" style="display:none">
    <h2 style="font-family:'Orbitron',sans-serif;font-size:16px;color:#22d3ee;margin:0 0 6px">Waiting for you</h2>
    <div id="pending"></div>
  </div>

  <div class="card" id="recentCard" style="display:none">
    <h2 style="font-family:'Orbitron',sans-serif;font-size:16px;color:#22d3ee;margin:0 0 6px">Recent</h2>
    <div id="recent"></div>
  </div>
</div>
<script>
(function () {
  var codeInput = document.getElementById('code');
  var msg = document.getElementById('msg');
  function money(c) { return '$' + (c / 100).toFixed(2); }
  function time(ms) { return new Date(ms).toLocaleString('en-US', { timeZone: 'America/New_York' }); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function load() {
    var code = codeInput.value;
    msg.className = 'msg'; msg.textContent = '';
    fetch('/api/admin/claims', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ok) { msg.classList.add('err'); msg.textContent = d.error || 'Something went wrong.'; return; }
        msg.classList.add('ok'); msg.textContent = 'Loaded.';
        document.getElementById('stats').innerHTML =
          '<span>Jackpot: <b>' + money(d.jackpotCents) + '</b></span>' +
          '<span>House cut so far: <b>' + money(d.houseCents) + '</b></span>' +
          '<span>Square auto-verify: <b>' + (d.autoVerify ? 'ON' : 'OFF') + '</b></span>';
        var p = document.getElementById('pending');
        document.getElementById('pendingCard').style.display = '';
        p.innerHTML = d.pending.length ? d.pending.map(function (c) {
          return '<div class="claim"><div class="row"><span class="tag' + (c.kind === 'bundle' ? ' bundle' : '') + '">' + (c.kind === 'bundle' ? 'BUNDLE $100' : 'SINGLE $5') + '</span>' +
            '<b>' + esc(c.player_name || 'Player') + '</b><span>' + money(c.amount_cents) + '</span><span class="muted">' + time(c.created_at) + '</span></div>' +
            '<div class="muted">Order: ' + esc(c.order_id || '—') + (c.receipt_ref ? ' • Receipt: ' + esc(c.receipt_ref) : '') + (c.verify_note ? ' • ' + esc(c.verify_note) : '') + '</div>' +
            '<div class="row" style="margin-top:8px"><button class="btn" data-act="confirm" data-id="' + c.id + '">Confirm — add plays</button>' +
            '<button class="btn ghost" data-act="reject" data-id="' + c.id + '">Reject</button></div></div>';
        }).join('') : '<p class="muted">Nothing waiting. Nice.</p>';
        var rEl = document.getElementById('recent');
        document.getElementById('recentCard').style.display = '';
        rEl.innerHTML = d.recent.length ? d.recent.map(function (c) {
          return '<div class="claim"><span class="tag' + (c.kind === 'bundle' ? ' bundle' : '') + '">' + c.status.toUpperCase() + '</span> ' +
            '<b>' + esc(c.player_name || 'Player') + '</b> — ' + (c.kind === 'bundle' ? 'Bundle $100' : 'Single $5') + ' • ' + time(c.created_at) + '</div>';
        }).join('') : '<p class="muted">No payments yet.</p>';
      })
      .catch(function () { msg.classList.add('err'); msg.textContent = 'Could not reach the game.'; });
  }
  document.getElementById('loadBtn').addEventListener('click', load);
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b) return;
    var code = codeInput.value;
    fetch('/api/admin/' + b.getAttribute('data-act'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code: code, paymentId: Number(b.getAttribute('data-id')) }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        msg.className = 'msg ' + (d.ok ? 'ok' : 'err');
        msg.textContent = d.ok ? (b.getAttribute('data-act') === 'confirm' ? 'Confirmed — plays added.' : 'Rejected.') : (d.error || 'Something went wrong.');
        if (d.ok) load();
      });
  });
})();
</script>
</body>
</html>
